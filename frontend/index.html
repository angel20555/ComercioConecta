<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ComercioConecta: red sintética de co-compra de tiendas de barrio."
    />
    <meta name="theme-color" content="#123a6b" />
    <script>
      (function () {
        try {
          var guardado = localStorage.getItem("cc-theme");
          var tema =
            guardado === "light" || guardado === "dark"
              ? guardado
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = tema;
          document.documentElement.style.colorScheme = tema;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute("content", tema === "dark" ? "#0a141d" : "#123a6b");
          }
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <title>ComercioConecta — red del barrio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
